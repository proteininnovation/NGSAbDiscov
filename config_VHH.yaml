processing:
  yyc_nt:
    - "TACTACTGC"
    - "TATTACTGC"
  wgq_nt:
    - "TGGGGACAA"

  hcdr3_min_len: 2
  hcdr3_max_len: 30
  read_count_min: 1
  read_freq_min: 0.00000001   # 1e-8 

  filters_include: []        # e.g. ["mPLXNB1"]
  filters_exclude: []        # e.g. ["VHH", "MACS"]

  skip_processed: false

combine:
  # Columns used for grouping in pivot table
  pivot_cols:
    - "cdr3_aa"
    - "CDR1"
    - "CDR2"
    - "CDR3"
    - "vh_scaffold"
    
    #- "FR1"
    #- "FR2"
    #- "FR3"
    #- "FR4"
    
    #- "anarci_anno"
    #- "cdr3_aa"
    #- "vh_scaffold"
    #- "vl_scaffold"
    #- "cdr3_functional"

  # Name of the CDR3 column (used for liabilities, clustering, length filtering)
  cdr3_col: "CDR3"

  # Filtering thresholds
  min_cdr3_len: 5
  max_cdr3_len: 30
  min_freq: 0.00001
  min_count: 5
  min_freq_sum: 0.00001
  min_reads_per_round: 5000
  remove_non_functional: false

  # Critical liabilities for rank adjustment
  critical_liabilities:
    - "l_glyco"
    - "l_RR"
    - "l_WW"
    - "l_cys"
    - "l_hydrophobic"
    - "l_neg_charge"
    - "l_pos_charge"
    - "l_arg"
    - "l_rmd"

  # Clustering
  greedy_cutoff: 0.85

  # Output
  top_leads_per_target: 1000000

pick_leads:
  min_freq_first: 0.0001
  min_freq_sum: 0.00005
  min_freq_table: 0.00001
  n_leads: 10000000
  critical_filtering: false
  priority_concentrations:
    - "4nM"
    - "20nM"
    - "100nM"
  dont_order_antigens: []

repeat_check:
  blosum_threshold: 0.8
  max_cdr3_len_blosum: 25
  n_workers: 8

fastp:
  qualified_quality_phred: 25
  unqualified_percent_limit: 20
  length_required: 50
  n_base_limit: 5
  correction: true
  overlap_len_require: 40
  overlap_diff_limit: 5
  thread: 48
  disable_adapter_trimming: true
  disable_trim_poly_g: true

ml:
  enabled: true
  backend: "auto"       # auto, ipi_psr, or delph
  fail_on_error: false  # keep the NGS run complete if optional ML is unavailable
  model_dir: "psr_model_ml"
  input_globs:
    - "by_protein/*_final_leads.xlsx"
  batch_size: 128
  device: "cpu"
  include_embeddings: false
  delph:
    package_path: "/alphafold/combio/software/delphi"
    module: "delphi"
    cdr3_column: "CDR3"
    command:
      - "bash -lc \"source /alphafold/combio/software/delphi/activate.sh >/dev/null && cd /alphafold/combio/software/delphi && python delphi.py --predict {input_q} --target psr_filter --lm biophysical --model xgboost --db ipi_psr_trainset\""
      - "bash -lc \"source /alphafold/combio/software/delphi/activate.sh >/dev/null && cd /alphafold/combio/software/delphi && python delphi.py --predict {input_q} --target psr_filter --lm kmer --model xgboost --db ipi_psr_trainset --model_path /alphafold/combio/software/delphi/pretrained_202605/FINAL_psr_filter_kmer_xgboost_ipi_psr_trainset.pkl\""
      - "bash -lc \"source /alphafold/combio/software/delphi/activate.sh >/dev/null && cd /alphafold/combio/software/delphi && python delphi.py --predict {input_q} --target sec_filter --lm biophysical --model xgboost --db ipi_psr_trainset\""
      - "bash -lc \"source /alphafold/combio/software/delphi/activate.sh >/dev/null && cd /alphafold/combio/software/delphi && python delphi.py --predict {input_q} --target sec_filter --lm kmer --model xgboost --db ipi_psr_trainset\""
    sequence_column: "HSEQ"
    require_full_hseq: true
    require_lseq: false
    drop_incomplete_sequences: true
    allow_cdr3_fallback: false
    force_no_lseq: true
    continue_on_command_error: true
    write_back_to_input: true
    cleanup_existing_outputs: true
    cleanup_intermediate_outputs: true
    write_dropped_audit: false
    callables:
      - "predict_dataframe"
      - "predict_df"
      - "score_dataframe"
      - "score_df"
      - "predict"
      - "score"

registry:
  enabled: true
  project: "IPI"
  path:
