  vhh_full:
    library_type: "vhh"
    vh_barcodes:
      VHH-IPI-101: "TGTGCCATTTCGGGTTCCGGTGGTAGCACCTAC"
      H1-69: "GGTGGTATTATTCCAATTTTTGGTACTGCTAAT"
      H1-46: "GGTATTATCAAACCATCTGGTGGTTCTACTTCT"
      H3-23_A: "TCTTATATATCTTCATCTGGTTCTACTATTTAT"
