# config.yaml - Single master configuration file

# Use --library <name> on command line to override default_library

# Set the default library here
#current_library: "standard_fab"   # ← CHANGE THIS LINE
current_library: "vhh_full"

library_aliases:
  fab: "standard_fab"
  fab_standard: "standard_fab"
  vhh: "vhh_full"
  mixed: "mixed"

# change these paths as needed, please install fastp and mafft and set their paths here 
# set base_dir and output_folder 
# set previous_antibodies_db to the path of the previous antibodies database file (download from Haisun shared folder)

general:
  base_dir: "/alphafold/combio/software/NGSAbDiscov"
  fastp_path: "/usr/local/lib/NGS_pipeline/annaconda3/bin/fastp"
  mafft_path: "/usr/local/lib/NGS_pipeline/annaconda3/bin/mafft"
  previous_antibodies_db: "/alphafold/combio/software/NGSAbDiscov/data/All_mAb_20260626_FACS_BLI.xlsx"
  output_folder: "results_VHH"



